<!doctype html>
<html lang="en-GB">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Polyhierarchies</title>
		<!-- Before the first paint, so a reload doesn't flash the system theme before Vue mounts -->
		<script>
			try {
				const saved = localStorage.getItem('theme');
				document.documentElement.dataset.theme =
					saved ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
			} catch {
				document.documentElement.dataset.theme = 'light';
			}
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Mono:wght@500&display=swap"
		/>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
